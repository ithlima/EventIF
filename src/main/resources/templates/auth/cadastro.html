<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Criar conta', ~{::#conteudo-pagina})}">
<body>
<div id="conteudo-pagina" class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-2">Criar conta de Participante</h1>
                    <p class="text-muted small mb-4">
                        Preencha seus dados para participar das atividades e emitir certificados.
                    </p>

                    <form th:action="@{/cadastro}" th:object="${cadastroForm}" method="post" novalidate>
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome completo</label>
                            <input type="text" id="nome" th:field="*{nome}"
                                   class="form-control"
                                   autocomplete="name"
                                   th:classappend="${#fields.hasErrors('nome')} ? ' is-invalid'"
                                   placeholder="Seu nome completo" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}">
                                Nome inválido
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" id="email" th:field="*{email}"
                                   class="form-control"
                                   autocomplete="email"
                                   th:classappend="${#fields.hasErrors('email')} ? ' is-invalid'"
                                   placeholder="seu.email@eventif.edu.br" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                E-mail inválido
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" id="senha" th:field="*{senha}"
                                   class="form-control"
                                   autocomplete="new-password"
                                   th:classappend="${#fields.hasErrors('senha')} ? ' is-invalid'"
                                   placeholder="Mínimo de 6 caracteres" required>
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}">
                                Senha inválida
                            </div>
                        </div>

                        <button type="submit" class="btn btn-eventif w-100">Cadastrar</button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center mb-0 small">
                        Já possui conta?
                        <a th:href="@{/login}" class="fw-semibold">Entrar agora</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
