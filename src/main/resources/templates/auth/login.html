<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Entrar', ~{::#conteudo-pagina})}">
<body>
<div id="conteudo-pagina" class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h3 mb-2">Entrar no EventIF</h1>
                    <p class="text-muted small mb-4">
                        Acesse sua conta com o e-mail e a senha cadastrados.
                    </p>

                    <div th:if="${param.erro}" class="alert alert-danger" role="alert">
                        E-mail ou senha inválidos, ou conta inativa.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success" role="alert">
                        Sessão encerrada com sucesso.
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" id="email" name="email" class="form-control"
                                   autocomplete="email"
                                   placeholder="seu.email@eventif.edu.br" required autofocus>
                        </div>
                        <div class="mb-4">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" id="senha" name="senha" class="form-control"
                                   autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-eventif w-100">Entrar</button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center mb-0 small">
                        Ainda não possui conta?
                        <a th:href="@{/cadastro}" class="fw-semibold">Cadastre-se como participante</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
