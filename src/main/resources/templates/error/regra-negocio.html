<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Operação não permitida', ~{::#conteudo-pagina})}">
<body>
<div id="conteudo-pagina" class="container py-5">
    <div class="alert alert-warning shadow-sm p-4" role="alert">
        <h1 class="h4 alert-heading">Não foi possível concluir a solicitação</h1>
        <p class="mb-3" th:text="${detalheErro ?: 'Regra de negócio violada.'}">
            Regra de negócio violada.
        </p>
        <a class="btn btn-outline-secondary btn-sm" th:href="@{/}">Voltar à página inicial</a>
    </div>
</div>
</body>
</html>
