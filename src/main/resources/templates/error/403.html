<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: page('Acesso negado', ~{::#conteudo-pagina})}">
<body>
<div id="conteudo-pagina" class="container py-5">
    <div class="alert alert-danger shadow-sm p-4" role="alert">
        <h1 class="h4 alert-heading">Acesso negado (403)</h1>
        <p class="mb-3" th:text="${detalheErro ?: 'Você não possui permissão para acessar ou alterar este recurso.'}">
            Você não possui permissão para acessar ou alterar este recurso.
        </p>
        <a class="btn btn-outline-danger btn-sm" th:href="@{/}">Voltar à página inicial</a>
    </div>
</div>
</body>
</html>
