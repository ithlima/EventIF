<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="page(titulo, conteudo)">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo} + ' — EventIF'">EventIF</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/eventif.css}">
</head>
<body class="d-flex flex-column min-vh-100">
<a class="visually-hidden-focusable position-absolute top-0 start-0 m-2 px-3 py-2 bg-white text-dark border rounded no-print"
   href="#conteudo-principal">Ir para o conteúdo principal</a>

<header th:fragment="header" class="no-print">
    <nav th:fragment="menu" class="navbar navbar-expand-lg navbar-dark eventif-navbar shadow-sm" aria-label="Navegação principal">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" th:href="@{/}">
                <span>EventIF</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                    aria-controls="menuPrincipal" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/}">Eventos</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('PARTICIPANTE')">
                        <a class="nav-link" th:href="@{/inscricoes}">Minhas inscrições</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ORGANIZADOR')">
                        <a class="nav-link" th:href="@{/organizador/eventos}">Meus eventos</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/categorias}">Categorias</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" th:href="@{/admin/usuarios}">Usuários</a>
                    </li>
                </ul>

                <div class="d-flex flex-wrap align-items-center gap-2 pt-2 pt-lg-0">
                    <div sec:authorize="isAnonymous()" class="d-flex gap-2">
                        <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Entrar</a>
                        <a class="btn btn-light btn-sm text-success fw-semibold" th:href="@{/cadastro}">Criar conta</a>
                    </div>
                    <div sec:authorize="isAuthenticated()" class="d-flex flex-wrap align-items-center gap-2 text-white">
                        <span class="small text-white fw-medium" sec:authentication="name">usuario@eventif.edu.br</span>
                        <form th:action="@{/logout}" method="post" class="d-inline m-0">
                            <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>

<div th:fragment="alerts" class="container mt-3 no-print">
    <div th:if="${mensagemSucesso}" class="alert alert-success alert-dismissible fade show shadow-sm mb-0" role="alert">
        <span th:text="${mensagemSucesso}">Operação realizada com sucesso.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
    <div th:if="${mensagemErro}" class="alert alert-danger alert-dismissible fade show shadow-sm mt-2 mb-0" role="alert">
        <span th:text="${mensagemErro}">Não foi possível concluir a operação.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
    </div>
</div>

<main id="conteudo-principal" class="flex-grow-1">
    <th:block th:replace="${conteudo}"></th:block>
</main>

<footer th:fragment="footer" class="eventif-footer mt-auto py-3 no-print">
    <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2 small">
        <span>EventIF — Sistema de Gestão de Eventos Acadêmicos</span>
        <span>IFCE Campus Fortaleza</span>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</footer>
</body>
</html>
