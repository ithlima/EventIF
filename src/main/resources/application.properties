spring.application.name=eventif
server.port=${SERVER_PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/eventif?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eventif_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:eventif_dev_pass}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.encoding=UTF-8
spring.messages.encoding=UTF-8

# Conta inicial de Administrador (RS07 - sobrescrever via variaveis de ambiente)
eventif.admin.nome=${EVENTIF_ADMIN_NOME:Administrador EventIF}
eventif.admin.email=${EVENTIF_ADMIN_EMAIL:admin@eventif.edu.br}
eventif.admin.senha=${EVENTIF_ADMIN_SENHA:AdminDemo@123}

# Carga idempotente de dados de exemplo (RT04 - sobrescrever via variaveis de ambiente)
eventif.seed.demo-enabled=${EVENTIF_SEED_DEMO_ENABLED:true}
eventif.demo.organizador.nome=${EVENTIF_DEMO_ORG_NOME:Prof. Carlos Organizador}
eventif.demo.organizador.email=${EVENTIF_DEMO_ORG_EMAIL:organizador@eventif.edu.br}
eventif.demo.organizador.senha=${EVENTIF_DEMO_ORG_SENHA:OrgDemo@123}
eventif.demo.organizador2.nome=${EVENTIF_DEMO_ORG2_NOME:Profa. Marina Organizadora}
eventif.demo.organizador2.email=${EVENTIF_DEMO_ORG2_EMAIL:organizador2@eventif.edu.br}
eventif.demo.organizador2.senha=${EVENTIF_DEMO_ORG2_SENHA:Org2Demo@123}
eventif.demo.participante.nome=${EVENTIF_DEMO_PART_NOME:Ana Clara Participante}
eventif.demo.participante.email=${EVENTIF_DEMO_PART_EMAIL:participante@eventif.edu.br}
eventif.demo.participante.senha=${EVENTIF_DEMO_PART_SENHA:PartDemo@123}
