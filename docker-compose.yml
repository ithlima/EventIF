services:
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-eventif}
      MYSQL_USER: ${MYSQL_USER:-eventif_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-eventif_dev_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-eventif_root_dev_pass}
      TZ: America/Fortaleza
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - eventif_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u \"$$MYSQL_USER\" --password=\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      SERVER_PORT: 8080
      TZ: America/Fortaleza
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-eventif}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Fortaleza&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-eventif_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-eventif_dev_pass}
      SPRING_JPA_DDL_AUTO: ${SPRING_JPA_DDL_AUTO:-update}
      EVENTIF_ADMIN_NOME: ${EVENTIF_ADMIN_NOME:-Administrador EventIF}
      EVENTIF_ADMIN_EMAIL: ${EVENTIF_ADMIN_EMAIL:-admin@eventif.edu.br}
      EVENTIF_ADMIN_SENHA: ${EVENTIF_ADMIN_SENHA:-AdminDemo@123}
      EVENTIF_SEED_DEMO_ENABLED: ${EVENTIF_SEED_DEMO_ENABLED:-true}
      EVENTIF_DEMO_ORG_NOME: ${EVENTIF_DEMO_ORG_NOME:-Prof. Carlos Organizador}
      EVENTIF_DEMO_ORG_EMAIL: ${EVENTIF_DEMO_ORG_EMAIL:-organizador@eventif.edu.br}
      EVENTIF_DEMO_ORG_SENHA: ${EVENTIF_DEMO_ORG_SENHA:-OrgDemo@123}
      EVENTIF_DEMO_ORG2_NOME: ${EVENTIF_DEMO_ORG2_NOME:-Profa. Marina Organizadora}
      EVENTIF_DEMO_ORG2_EMAIL: ${EVENTIF_DEMO_ORG2_EMAIL:-organizador2@eventif.edu.br}
      EVENTIF_DEMO_ORG2_SENHA: ${EVENTIF_DEMO_ORG2_SENHA:-Org2Demo@123}
      EVENTIF_DEMO_PART_NOME: ${EVENTIF_DEMO_PART_NOME:-Ana Clara Participante}
      EVENTIF_DEMO_PART_EMAIL: ${EVENTIF_DEMO_PART_EMAIL:-participante@eventif.edu.br}
      EVENTIF_DEMO_PART_SENHA: ${EVENTIF_DEMO_PART_SENHA:-PartDemo@123}

volumes:
  eventif_mysql_data:
